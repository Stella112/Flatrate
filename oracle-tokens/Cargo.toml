[package]
name = "flatrate-oracle-tokens"
version = "0.1.0"
edition = "2021"
description = "OutLayer WASI component (extra 2): Llama 3.3 70B output price per 1M tokens across OpenRouter providers, median"

# Built separately for wasm32-wasip2; not part of the contracts workspace. Kept apart from
# oracle/ so the H100 oracle's reproducible hash (pinned on-chain) does not change.
[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "flatrate-oracle-tokens"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flatrate-shared = { path = "../shared" }

[target.'cfg(target_os = "wasi")'.dependencies]
wasi-http-client = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
