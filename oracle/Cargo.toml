[package]
name = "flatrate-oracle"
version = "0.1.0"
edition = "2021"
description = "OutLayer WASI component: fetch H100 hourly prices from public APIs and return the median"

# Built separately for wasm32-wasip2; not part of the contracts workspace.
[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "flatrate-oracle"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flatrate-shared = { path = "../shared" }

[target.'cfg(target_os = "wasi")'.dependencies]
wasi-http-client = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
